services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: markdown2pdf
      POSTGRES_USER: markdown2pdf
      POSTGRES_PASSWORD: markdown2pdf_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markdown2pdf -d markdown2pdf"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  local_postgres_data:
